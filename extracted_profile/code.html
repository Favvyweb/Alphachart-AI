<script>
  document.getElementById('logout-btn').addEventListener('click', function() {
    const btn = this;
    btn.classList.add('scale-95', 'opacity-50');
    setTimeout(() => {
      btn.classList.remove('scale-95', 'opacity-50');
      // Simple interaction feedback
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
      setTimeout(() => {
        btn.innerHTML = originalText;
      }, 1000);
    }, 150);
  });

  // Simple intersection observer for reveal effect
  const observerOptions = {
    threshold: 0.1
  };

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('opacity-100', 'translate-y-0');
        entry.target.classList.remove('opacity-0', 'translate-y-4');
      }
    });
  }, observerOptions);

  document.querySelectorAll('.bg-surface-container').forEach(el => {
    el.classList.add('opacity-0', 'translate-y-4', 'transition-all', 'duration-500');
    observer.observe(el);
  });
