<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="neonCyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#080a0f" rx="96"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect x="12" y="12" width="488" height="488" fill="none" stroke="#00ff88" stroke-width="4" stroke-opacity="0.3" rx="88"/>

  <!-- Candlestick 1 (Left) -->
  <line x1="145" y1="180" x2="145" y2="360" stroke="#00ff88" stroke-width="6" stroke-linecap="round"/>
  <rect x="120" y="210" width="50" height="110" fill="url(#neonGreenGrad)" rx="6"/>

  <!-- Candlestick 2 (Center) -->
  <line x1="256" y1="120" x2="256" y2="380" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <rect x="231" y="160" width="50" height="170" fill="url(#neonCyanGrad)" rx="6"/>

  <!-- Candlestick 3 (Right) -->
  <line x1="367" y1="80" x2="367" y2="340" stroke="#00ff88" stroke-width="6" stroke-linecap="round"/>
  <rect x="342" y="110" width="50" height="190" fill="url(#neonGreenGrad)" rx="6"/>

  <!-- Dynamic Momentum Line -->
  <path d="M 90 380 Q 180 340, 256 220 T 420 90" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <polygon points="420,75 435,105 405,100" fill="#ffffff"/>

  <!-- Bottom Brand Text -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="6" text-anchor="middle">ALPHACHART</text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18" font-weight="700" fill="#00ff88" letter-spacing="4" text-anchor="middle">AI SCALP ENGINE</text>
</svg>

